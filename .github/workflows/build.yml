name: Build ESP32

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/setup-esp-idf@v1
        with:
          esp-idf-version: v5.1
          target: esp32
      - run: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin

