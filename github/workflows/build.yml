name: Build ESP32 NAT Router

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Baixar e configurar ESP-IDF v5.1
        run: |
          git clone --recursive https://github.com/espressif/esp-idf.git --branch v5.1 --depth 1
          cd esp-idf
          ./install.sh esp32
          . ./export.sh

      - name: Compilar o firmware
        run: |
          . esp-idf/export.sh
          idf.py build

      - name: Salvar arquivo .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: build/esp32_nat_router.bin
